name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC - without this, publish fails with ENEEDAUTH

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest # OIDC requires npm >= 11.5.1
      - run: npm ci
      # semantic-release no longer commits the bump back to master, so the
      # checked-out package.json still carries the previous version. The tag
      # is the source of truth, and tagFormat is a bare ${version}, so the tag
      # name is the version verbatim.
      - run: npm version "${{ github.event.release.tag_name }}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npm publish
