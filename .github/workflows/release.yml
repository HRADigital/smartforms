name: Release

# Runs only after the CI workflow finished successfully for the same commit -
# a release must never go out on a commit that CI rejected. CI is the single
# source of truth for lint, format, tests (Node 20 + 22), build and commit
# messages, so none of that is repeated here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    # workflow_dispatch has no workflow_run payload, hence the second clause.
    # The release commit pushed back by semantic-release carries [skip ci], so
    # it never starts a CI run and cannot loop back into this workflow.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit CI validated, not whatever master points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          # semantic-release 25 requires ^22.14 || >=24.10 - this is the
          # release runner only; the package itself still supports Node 20.
          node-version: 22
          cache: npm
          # The .npmrc written here holds a placeholder that is only resolved
          # from NODE_AUTH_TOKEN, so every npm command that needs the registry
          # must set it. semantic-release no longer publishes, so it never
          # reads this file.
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Built here rather than left to prepublishOnly, so a broken build fails
      # before semantic-release tags and commits anything.
      - run: npm run build
      - name: Verify dist outputs
        run: |
          test -f dist/smartforms.mjs
          test -f dist/smartforms.cjs
          test -f dist/smartforms.umd.js
      # Versions, writes the CHANGELOG, tags, and cuts the GitHub release. The
      # npm registry is not involved, so nothing here depends on NPM_TOKEN.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Publishing is a separate, non blocking step on purpose: a rejected npm
      # token, an unclaimed scope or a registry outage must not undo or hold
      # back a release that is already tagged and announced on GitHub. The next
      # release retries the publish, or it can be done by hand from the tag.
      - name: Publish to npm
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          # semantic-release leaves the version untouched when it releases
          # nothing, so this is also the "no new release" exit.
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on the registry - nothing to publish."
            exit 0
          fi
          npm publish --access public --provenance
