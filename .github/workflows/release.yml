name: Release

# Runs only after the CI workflow finished successfully for the same commit -
# a release must never go out on a commit that CI rejected. CI is the single
# source of truth for lint, format, tests (Node 20 + 22), build and commit
# messages, so none of that is repeated here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    # workflow_dispatch has no workflow_run payload, hence the second clause.
    # The release commit pushed back by semantic-release carries [skip ci], so
    # it never starts a CI run and cannot loop back into this workflow.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # A GitHub App token, not the default GITHUB_TOKEN, for two reasons:
      # the master ruleset requires a pull request, and only an actor on the
      # bypass list may push the release commit directly; and events raised by
      # GITHUB_TOKEN never start another workflow, so a release it created
      # would silently fail to trigger publish.yml.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          # The exact commit CI validated, not whatever master points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          # semantic-release 25 requires ^22.14 || >=24.10 - this is the
          # release runner only; the package itself still supports Node 20.
          node-version: 22
          cache: npm
      - run: npm ci
      # Built here rather than left to prepublishOnly, so a broken build fails
      # before semantic-release tags and commits anything.
      - run: npm run build
      - name: Verify dist outputs
        run: |
          test -f dist/smartforms.mjs
          test -f dist/smartforms.cjs
          test -f dist/smartforms.umd.js
      # Versions, writes the CHANGELOG, tags, and cuts the GitHub release. The
      # npm registry is not involved here - publishing is handled by
      # publish.yml, which triggers on the release this step creates and
      # authenticates to npm over OIDC trusted publishing.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release
