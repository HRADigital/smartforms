name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    # The release commit is pushed back by semantic-release itself - never
    # let it trigger a second run.
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          # semantic-release 25 requires ^22.14 || >=24.10 - this is the
          # release runner only; the package itself still supports Node 20.
          node-version: 22
          cache: npm
          # No registry-url on purpose: it makes setup-node write an .npmrc
          # holding the literal "XXXXX-XXXXX-XXXXX-XXXXX" placeholder and point
          # NPM_CONFIG_USERCONFIG at it, which overrides NPM_TOKEN and fails
          # authentication. semantic-release writes its own .npmrc instead.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Verify dist outputs
        run: |
          test -f dist/smartforms.mjs
          test -f dist/smartforms.cjs
          test -f dist/smartforms.umd.js
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
